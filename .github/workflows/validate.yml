name: Validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: chmod +x scripts/validate-manifest.sh
      - run: ./scripts/validate-manifest.sh .

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m py_compile omarchy-macropad-apply.py

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck -S warning install.sh uninstall.sh bin/omarchy-macropad-remap
